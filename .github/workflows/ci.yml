name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  copy:
    name: Copy lint
    runs-on: ubuntu-latest
    container: node:24-slim
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Lint tests
        run: npm run test:tools
      - name: Lint documents and interface text
        run: npm run lint:copy
      - name: Versions and changelog
        run: npm run check:version
      - name: Lint commit messages
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # A branch lints every commit main does not have, so a run cancelled by a newer push
          # cannot leave commits unlinted and a merge from main adds none of main's. Main lints
          # the pushed range. A tag points at a release commit already linted on its branch.
          case "${{ github.event_name }}:${{ github.ref_type }}:${{ github.ref_name }}" in
            pull_request:*)
              range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" ;;
            push:tag:*)
              echo "Tag push: commit messages were linted on the branch."; exit 0 ;;
            push:branch:main)
              range="${{ github.event.before }}..${{ github.sha }}"
              git cat-file -e "${{ github.event.before }}" 2>/dev/null || range="${{ github.sha }}~1..${{ github.sha }}" ;;
            *)
              range="origin/main..${{ github.sha }}" ;;
          esac
          echo "Linting $(git rev-list --no-merges --count "$range") commits in $range"
          status=0
          for sha in $(git rev-list --no-merges "$range"); do
            git log -1 --format=%B "$sha" > /tmp/msg
            node tools/lint-copy/lint-copy.mjs --commit-msg /tmp/msg || { echo "in commit $sha"; status=1; }
          done
          exit $status

  rust:
    name: Rust
    runs-on: ubuntu-latest
    container: rust:1.98.1-slim-bookworm
    steps:
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl make gcc libc6-dev pkg-config
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            target
          key: rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: rust-
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  bench:
    name: Decoder gate
    runs-on: ubuntu-latest
    needs: rust
    container: rust:1.98.1-slim-bookworm
    steps:
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl make gcc libc6-dev pkg-config
      - uses: actions/checkout@v4
      - name: Check for a recorded baseline
        id: ready
        run: |
          if [ -f bench/baseline.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "No bench/baseline.json yet; the gate starts with the first recorded baseline."; fi
      - uses: actions/cache@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          path: |
            /usr/local/cargo/registry
            target
          key: bench-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: bench-
      - name: Fetch public test files
        if: steps.ready.outputs.ready == 'true'
        run: sh tools/corpus/fetch-ft8lib.sh
      - name: Synthesise CI sets
        if: steps.ready.outputs.ready == 'true'
        run: cargo run --release -p rr73-bench -- synth --set smoke --set noise-ci --out corpus/synthetic
      # Two presets are gated: baseline (the ft8_lib method, the research reference) and
      # subtract-3-osd2 (the preset the app ships); see "CI gate" in docs/bench.md. The shipped
      # preset runs even when the baseline gate fails, so one CI run reports both.
      - name: Run the baseline preset
        if: steps.ready.outputs.ready == 'true'
        run: cargo run --release -p rr73-bench -- run --preset baseline --out results/ci.json corpus/public corpus/synthetic
      - name: Gate baseline against bench/baseline.json
        if: steps.ready.outputs.ready == 'true'
        run: cargo run --release -p rr73-bench -- gate results/ci.json --baseline bench/baseline.json
      - name: Run the subtract-3-osd2 preset
        if: ${{ !cancelled() && steps.ready.outputs.ready == 'true' }}
        run: cargo run --release -p rr73-bench -- run --preset subtract-3-osd2 --out results/ci-subtract-3-osd2.json corpus/public corpus/synthetic
      - name: Gate subtract-3-osd2 against bench/subtract-3-osd2.json
        if: ${{ !cancelled() && steps.ready.outputs.ready == 'true' }}
        run: cargo run --release -p rr73-bench -- gate results/ci-subtract-3-osd2.json --baseline bench/subtract-3-osd2.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.ready.outputs.ready == 'true' }}
        with:
          name: bench-results
          path: |
            results/ci.json
            results/ci-subtract-3-osd2.json

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    container: rust:1.98.1-slim-bookworm
    steps:
      - name: Install build tools and wasm-pack
        run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl
          curl -fsSL https://github.com/rustwasm/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C /usr/local/bin --strip-components=1 wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            target
          key: wasm-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: wasm-
      - name: Build
        run: wasm-pack build crates/rr73-wasm --release --target web --out-dir ../../web/src/wasm/pkg
      - uses: actions/upload-artifact@v4
        with: { name: wasm-pkg, path: web/src/wasm/pkg }

  refdata:
    name: Reference data
    runs-on: ubuntu-latest
    container: node:24-slim
    steps:
      - uses: actions/checkout@v4
      - name: Today's date, UTC
        id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      # One cache entry per UTC day. Later runs that day restore it and make no requests, so
      # frequent pushes and releases do not download the sources again. The first run of a day
      # restores the newest entry and asks each source once, conditionally where it can
      # (tools/refdata/build.mjs).
      - uses: actions/cache@v4
        with:
          path: .refdata-cache
          key: refdata-${{ steps.day.outputs.day }}
          restore-keys: refdata-
      - name: Build reference data
        run: node tools/refdata/build.mjs --out web/public/data --cache .refdata-cache
      - uses: actions/upload-artifact@v4
        with: { name: refdata, path: web/public/data }

  web:
    name: Web
    runs-on: ubuntu-latest
    needs: [wasm, refdata]
    container: node:24-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: wasm-pkg, path: web/src/wasm/pkg }
      - uses: actions/download-artifact@v4
        with: { name: refdata, path: web/public/data }
      - name: Install
        run: npm --prefix web ci --no-audit --no-fund
      - name: Type check
        run: npm --prefix web run check
      - name: Lint CSS
        run: npm --prefix web run lint:css
      - name: Unit tests
        run: npm --prefix web test
      - name: Build for GitHub Pages
        run: npm --prefix web run build:pages
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Check the reference data in the build
        run: node tools/refdata/verify-dist.mjs web/dist
      - uses: actions/upload-pages-artifact@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with: { path: web/dist }

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [wasm, refdata]
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: wasm-pkg, path: web/src/wasm/pkg }
      - uses: actions/download-artifact@v4
        with: { name: refdata, path: web/public/data }
      - name: Install
        run: npm --prefix web ci --no-audit --no-fund
      - name: Playwright
        run: npx --prefix web playwright test
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: web/playwright-report }

  deploy:
    name: Deploy to GitHub Pages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [copy, rust, bench, web, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
