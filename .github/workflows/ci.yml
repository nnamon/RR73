name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  copy:
    name: Copy lint
    runs-on: ubuntu-latest
    container: node:24-slim
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Lint tests
        run: npm run test:tools
      - name: Lint documents and interface text
        run: npm run lint:copy
      - name: Versions and changelog
        run: npm run check:version
      - name: Lint commit messages
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # A branch lints every commit main does not have, so a run cancelled by a newer push
          # cannot leave commits unlinted and a merge from main adds none of main's. Main lints
          # the pushed range. A tag points at a release commit already linted on its branch.
          case "${{ github.event_name }}:${{ github.ref_type }}:${{ github.ref_name }}" in
            pull_request:*)
              range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" ;;
            push:tag:*)
              echo "Tag push: commit messages were linted on the branch."; exit 0 ;;
            push:branch:main)
              range="${{ github.event.before }}..${{ github.sha }}"
              git cat-file -e "${{ github.event.before }}" 2>/dev/null || range="${{ github.sha }}~1..${{ github.sha }}" ;;
            *)
              range="origin/main..${{ github.sha }}" ;;
          esac
          echo "Linting $(git rev-list --no-merges --count "$range") commits in $range"
          status=0
          for sha in $(git rev-list --no-merges "$range"); do
            git log -1 --format=%B "$sha" > /tmp/msg
            node tools/lint-copy/lint-copy.mjs --commit-msg /tmp/msg || { echo "in commit $sha"; status=1; }
          done
          exit $status

  # A tag points at a release commit whose branch run passed: tools/release/release.sh publish
  # checks it before tagging. The tag's run then skips Rust, the decoder gate and the end-to-end
  # tests, and builds and deploys. Every other run, and a tag whose lookup fails, runs them all.
  verified:
    name: Earlier run on this commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      passed: ${{ steps.look.outputs.passed }}
    steps:
      - id: look
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&status=success" --jq .total_count) || n=0
          echo "Passed CI runs on ${{ github.sha }}: $n"
          if [ "${n:-0}" -gt 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; fi

  # The Rust jobs cache the registry and target/ under a key that changes with the dependencies
  # and the toolchain only (tools/ci/deps-key.sh). Main saves a key it does not find; branches and
  # pull requests read main's caches and save none. zstd compresses them: with gzip, saving
  # 2.9 GB took 10 min.
  rust:
    name: Rust
    needs: verified
    if: needs.verified.outputs.passed != 'true'
    runs-on: ubuntu-latest
    container: rust:1.98.1-slim-bookworm
    env:
      # Backtraces keep their files and lines, and target/ stays small enough to cache.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl make gcc libc6-dev pkg-config zstd
      - uses: actions/checkout@v4
      - name: Dependency key
        id: deps
        run: echo "key=$(sh tools/ci/deps-key.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            /usr/local/cargo/registry
            target
          key: rust-deps-${{ steps.deps.outputs.key }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && 'rust-deps-' || '' }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            /usr/local/cargo/registry
            target
          key: rust-deps-${{ steps.deps.outputs.key }}

  bench:
    name: Decoder gate
    needs: verified
    if: needs.verified.outputs.passed != 'true'
    runs-on: ubuntu-latest
    container: rust:1.98.1-slim-bookworm
    steps:
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl make gcc libc6-dev pkg-config zstd
      - uses: actions/checkout@v4
      - name: Check for a recorded baseline
        id: ready
        run: |
          if [ -f bench/baseline.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "No bench/baseline.json yet; the gate starts with the first recorded baseline."; fi
      - name: Dependency key
        if: steps.ready.outputs.ready == 'true'
        id: deps
        run: echo "key=$(sh tools/ci/deps-key.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        if: steps.ready.outputs.ready == 'true'
        id: cache
        with:
          path: |
            /usr/local/cargo/registry
            target
          key: bench-deps-${{ steps.deps.outputs.key }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && 'bench-deps-' || '' }}
      - name: Fetch public test files
        if: steps.ready.outputs.ready == 'true'
        run: sh tools/corpus/fetch-ft8lib.sh
      - name: Synthesise CI sets
        if: steps.ready.outputs.ready == 'true'
        run: cargo run --release -p rr73-bench -- synth --set smoke --set noise-ci --out corpus/synthetic
      # Two presets are gated: baseline (the ft8_lib method, the research reference) and
      # subtract-3-osd2 (the preset the app ships); see "CI gate" in docs/bench.md. The shipped
      # preset runs even when the baseline gate fails, so one CI run reports both.
      - name: Run the baseline preset
        if: steps.ready.outputs.ready == 'true'
        run: cargo run --release -p rr73-bench -- run --preset baseline --out results/ci.json corpus/public corpus/synthetic
      - name: Gate baseline against bench/baseline.json
        if: steps.ready.outputs.ready == 'true'
        run: cargo run --release -p rr73-bench -- gate results/ci.json --baseline bench/baseline.json
      - name: Run the subtract-3-osd2 preset
        if: ${{ !cancelled() && steps.ready.outputs.ready == 'true' }}
        run: cargo run --release -p rr73-bench -- run --preset subtract-3-osd2 --out results/ci-subtract-3-osd2.json corpus/public corpus/synthetic
      - name: Gate subtract-3-osd2 against bench/subtract-3-osd2.json
        if: ${{ !cancelled() && steps.ready.outputs.ready == 'true' }}
        run: cargo run --release -p rr73-bench -- gate results/ci-subtract-3-osd2.json --baseline bench/subtract-3-osd2.json
      # The later stages the app runs after subtract-3-osd2 on FT8 and FT4 slots (DEEP in
      # web/src/lib/decode/worker-client.ts), gated against bench/subtract-3-osd2-deep.json.
      # The smoke set's 6 FT4 slots run them too.
      - name: Run subtract-3-osd2 with the later stages
        if: ${{ !cancelled() && steps.ready.outputs.ready == 'true' }}
        run: >-
          cargo run --release -p rr73-bench -- run --preset subtract-3-osd2
          --then "subtract-3-osd2 spectrogram.time_osr=4 spectrogram.freq_osr=4 spectrogram.window_symbols=2 search.skip_silent_frames=true validate.osd_min_snr_db=-23 ap.my_anywhere=false"
          --then "subtract-3-osd2 spectrogram.time_osr=8 spectrogram.freq_osr=4 spectrogram.window_symbols=2 search.skip_silent_frames=true validate.osd_min_snr_db=-23 ldpc.osd_window=91 search.max_candidates=400 search.min_score_db=2 ap.my_anywhere=false search.ft8_dt_max_s=2.5 search.ft4_dt_max_s=1.0 search.partial_min_score_db=null spectrogram.freq_max_hz=3000"
          --out results/ci-subtract-3-osd2-deep.json corpus/public corpus/synthetic
      - name: Gate the later stages against bench/subtract-3-osd2-deep.json
        if: ${{ !cancelled() && steps.ready.outputs.ready == 'true' }}
        run: cargo run --release -p rr73-bench -- gate results/ci-subtract-3-osd2-deep.json --baseline bench/subtract-3-osd2-deep.json
      # A priori decoding: the shipped preset on messages to the operator and on noise, each
      # slot with the QSO context the app gives (crates/rr73-decode/src/ap.rs), rendered in
      # memory; thresholds in bench/gate-ap.toml.
      - name: Run subtract-3-osd2 on the ap-sweep set
        if: ${{ !cancelled() && steps.ready.outputs.ready == 'true' }}
        run: cargo run --release -p rr73-bench -- run --preset subtract-3-osd2 --synth ap-sweep --per-step 10 --noise-count 300 --out results/ci-ap.json
      - name: Gate a priori decoding against bench/subtract-3-osd2-ap.json
        if: ${{ !cancelled() && steps.ready.outputs.ready == 'true' }}
        run: cargo run --release -p rr73-bench -- gate results/ci-ap.json --baseline bench/subtract-3-osd2-ap.json --thresholds bench/gate-ap.toml
      # The early pass (EARLY_S in web/src/lib/clock/slots.ts, experiment 0006): the shipped
      # preset on the first 13.5 s of each CI slot, and FT4 on the first 6 s of a small
      # ft4-sweep rendered in memory; thresholds in bench/gate.toml and bench/gate-ft4.toml.
      - name: Run subtract-3-osd2 on the first 13.5 s of each slot
        if: ${{ !cancelled() && steps.ready.outputs.ready == 'true' }}
        run: cargo run --release -p rr73-bench -- run --preset subtract-3-osd2 --audio-s 13.5 --out results/ci-early.json corpus/public corpus/synthetic
      - name: Gate the early pass against bench/subtract-3-osd2-early.json
        if: ${{ !cancelled() && steps.ready.outputs.ready == 'true' }}
        run: cargo run --release -p rr73-bench -- gate results/ci-early.json --baseline bench/subtract-3-osd2-early.json
      - name: Run subtract-3-osd2 on the first 6 s of each ft4-sweep slot
        if: ${{ !cancelled() && steps.ready.outputs.ready == 'true' }}
        run: cargo run --release -p rr73-bench -- run --preset subtract-3-osd2 --audio-s 6 --synth ft4-sweep --per-step 5 --crowded-count 5 --noise-count 300 --out results/ci-ft4-early.json
      - name: Gate the FT4 early pass against bench/subtract-3-osd2-ft4-early.json
        if: ${{ !cancelled() && steps.ready.outputs.ready == 'true' }}
        run: cargo run --release -p rr73-bench -- gate results/ci-ft4-early.json --baseline bench/subtract-3-osd2-ft4-early.json --thresholds bench/gate-ft4.toml
      # WSPR: the wspr preset on wspr-smoke and 50 wspr-noise slots, rendered in memory so no
      # 2.9 MB WAV file per 120 s slot is written. Gated against bench/wspr.json with
      # bench/gate-wspr.toml.
      - name: Run the wspr preset
        if: ${{ !cancelled() && steps.ready.outputs.ready == 'true' }}
        run: cargo run --release -p rr73-bench -- run --preset wspr --synth wspr-smoke --synth wspr-noise --noise-count 50 --out results/ci-wspr.json
      - name: Gate wspr against bench/wspr.json
        if: ${{ !cancelled() && steps.ready.outputs.ready == 'true' }}
        run: cargo run --release -p rr73-bench -- gate results/ci-wspr.json --baseline bench/wspr.json --thresholds bench/gate-wspr.toml
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.ready.outputs.ready == 'true' }}
        with:
          name: bench-results
          path: |
            results/ci.json
            results/ci-subtract-3-osd2.json
            results/ci-subtract-3-osd2-deep.json
            results/ci-early.json
            results/ci-ft4-early.json
            results/ci-wspr.json
      - uses: actions/cache/save@v4
        if: steps.ready.outputs.ready == 'true' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            /usr/local/cargo/registry
            target
          key: bench-deps-${{ steps.deps.outputs.key }}

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    container: rust:1.98.1-slim-bookworm
    steps:
      - name: Install build tools and wasm-pack
        run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl zstd
          curl -fsSL https://github.com/rustwasm/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C /usr/local/bin --strip-components=1 wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack
      - uses: actions/checkout@v4
      - name: Dependency key
        id: deps
        run: echo "key=$(sh tools/ci/deps-key.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            /usr/local/cargo/registry
            target
          key: wasm-deps-${{ steps.deps.outputs.key }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && 'wasm-deps-' || '' }}
      - name: Build
        run: wasm-pack build crates/rr73-wasm --release --target web --out-dir ../../web/src/wasm/pkg
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            /usr/local/cargo/registry
            target
          key: wasm-deps-${{ steps.deps.outputs.key }}
      - uses: actions/upload-artifact@v4
        with: { name: wasm-pkg, path: web/src/wasm/pkg }

  refdata:
    name: Reference data
    runs-on: ubuntu-latest
    container: node:24-slim
    # actions: read lists the repository's caches, to find whether any run asked SOTA today.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Today's date, UTC
        id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      # The newest cache this run can read: today's or an earlier day's, from this branch or main.
      - uses: actions/cache/restore@v4
        id: restore
        with:
          path: .refdata-cache
          key: refdata-${{ steps.day.outputs.day }}
          restore-keys: refdata-
      # Main asks POTA and SOTA, each once a day; other refs build from the cache they
      # restored. SOTA is asked once a day across all branches (tools/refdata/ci-plan.mjs). The
      # country file is never asked: build.mjs builds it from the release in refdata/bigcty.
      - name: Choose the sources to ask
        id: plan
        run: node tools/refdata/ci-plan.mjs
        env:
          DAY: ${{ steps.day.outputs.day }}
          RESTORED: ${{ steps.restore.outputs.cache-matched-key }}
          GITHUB_TOKEN: ${{ github.token }}
      # Saved before the request, so a run cancelled or failed during the download still counts.
      - name: Record today's SOTA request
        if: steps.plan.outputs.sota == 'true'
        uses: actions/cache/save@v4
        with:
          path: .refdata-sota
          key: sota-asked-${{ steps.day.outputs.day }}
      - name: Build reference data
        run: node tools/refdata/build.mjs --out web/public/data --cache .refdata-cache --ask "${{ steps.plan.outputs.ask }}"
      # Also after a failure: the cache records each request, and a later run that day asks again
      # only for sources it holds no record of.
      - name: Keep the downloads
        if: always() && steps.plan.outputs.ask != '' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .refdata-cache
          key: refdata-${{ steps.day.outputs.day }}
      - uses: actions/upload-artifact@v4
        with: { name: refdata, path: web/public/data }

  web:
    name: Web
    runs-on: ubuntu-latest
    needs: [wasm, refdata]
    container: node:24-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: wasm-pkg, path: web/src/wasm/pkg }
      - uses: actions/download-artifact@v4
        with: { name: refdata, path: web/public/data }
      - name: Install
        run: npm --prefix web ci --no-audit --no-fund
      - name: Type check
        run: npm --prefix web run check
      - name: Lint CSS
        run: npm --prefix web run lint:css
      - name: Unit tests
        run: npm --prefix web test
      - name: Build for GitHub Pages
        run: npm --prefix web run build:pages
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Check the reference data in the build
        run: node tools/refdata/verify-dist.mjs web/dist
      - uses: actions/upload-pages-artifact@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with: { path: web/dist }

  # Two machines: the transmit and practice projects, which need a machine with no other test
  # running, on one and the rest of the suite on the other (RR73_E2E_PART in
  # web/playwright.config.ts).
  e2e:
    name: End-to-end, ${{ matrix.part }}
    needs: [verified, wasm, refdata]
    if: needs.verified.outputs.passed != 'true'
    strategy:
      fail-fast: false
      matrix:
        part: [quiet, transmit]
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: wasm-pkg, path: web/src/wasm/pkg }
      - uses: actions/download-artifact@v4
        with: { name: refdata, path: web/public/data }
      - name: Install
        run: npm --prefix web ci --no-audit --no-fund
      # The same fonts as the local e2e image (tools/e2e/Dockerfile), so text measures the same.
      - name: Fonts
        run: |
          apt-get update
          apt-get install -y --no-install-recommends fonts-inter fonts-jetbrains-mono
          cp tools/e2e/fonts.conf /etc/fonts/local.conf
          fc-cache -f
      - name: Playwright
        run: npx --prefix web playwright test
        env:
          HOME: /root
          RR73_E2E_PART: ${{ matrix.part }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: 'playwright-report-${{ matrix.part }}', path: web/playwright-report }

  # A release carries QSP, the relay, at the app's version: its binaries for x86-64 and ARM64
  # Linux on the GitHub release, and the image ghcr.io/<owner>/rr73-qsp:<version> and :latest
  # (crates/rr73-qsp/README.md). Each architecture builds on a runner of its own.
  qsp-build:
    name: QSP for ${{ matrix.arch }}
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - { arch: x86_64, docker: amd64, runner: ubuntu-latest }
          - { arch: aarch64, docker: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container: rust:1.98.1-slim-bookworm
    steps:
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates make gcc libc6-dev pkg-config
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release --locked -p rr73-qsp
      - name: Package
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          d="rr73-qsp-$v-linux-${{ matrix.arch }}"
          mkdir -p "dist/$d"
          cp target/release/rr73-qsp crates/rr73-qsp/qsp.example.toml crates/rr73-qsp/qsp.service crates/rr73-qsp/README.md LICENSE-MIT LICENSE-APACHE "dist/$d/"
          tar -C dist -czf "dist/$d.tar.gz" "$d"
          cp target/release/rr73-qsp "dist/rr73-qsp-${{ matrix.docker }}"
      - uses: actions/upload-artifact@v4
        with:
          name: qsp-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/rr73-qsp-${{ matrix.docker }}

  qsp-publish:
    name: Publish QSP
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && !failure()
    needs: [copy, rust, bench, web, e2e, qsp-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: 'qsp-*', path: dist, merge-multiple: true }
      - name: Attach the binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # tools/release/release.sh publish creates the release just after it pushes the tag.
          for _ in $(seq 1 30); do gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && break; sleep 10; done
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish the image
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${{ github.repository_owner }}/rr73-qsp"
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 -f docker/qsp-release.Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME#v}" \
            -t "$image:${GITHUB_REF_NAME#v}" -t "$image:latest" --push dist

  # The desktop app (desktop/, docs/design/desktop.md): unsigned installers for Windows, macOS and
  # Linux around one web build with base /. Every run builds them and keeps them as workflow
  # artifacts; a release tag also attaches them to the GitHub release.
  desktop-web:
    name: Desktop web build
    needs: [wasm, refdata]
    runs-on: ubuntu-latest
    container: node:24-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: wasm-pkg, path: web/src/wasm/pkg }
      - uses: actions/download-artifact@v4
        with: { name: refdata, path: web/public/data }
      - name: Install
        run: npm --prefix web ci --no-audit --no-fund
      - name: Build
        run: npm --prefix web run build
        env:
          GITHUB_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with: { name: desktop-web, path: web/dist }

  desktop:
    name: Desktop, ${{ matrix.os }}
    needs: [desktop-web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: Linux, runner: ubuntu-22.04, bundles: 'deb,appimage', target: '' }
          - { os: Windows, runner: windows-latest, bundles: 'nsis,msi', target: '' }
          - { os: macOS, runner: macos-latest, bundles: 'dmg', target: universal-apple-darwin }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: desktop-web, path: web/dist }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: System libraries
        if: matrix.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libudev-dev patchelf file
      # rustup reads rust-toolchain.toml; the universal macOS build needs both Mac targets.
      - name: Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          if [ "${{ matrix.os }}" = macOS ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target/desktop
          key: desktop-${{ matrix.os }}-${{ hashFiles('desktop/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: desktop-${{ matrix.os }}-
      # The system backend's tests open a pseudo-terminal as the radio (desktop/src/system.rs).
      - name: Test and lint
        if: matrix.os == 'Linux'
        working-directory: desktop
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Install the Tauri command line
        run: npm --prefix desktop ci --no-audit --no-fund
      # The restored cache can hold earlier versions' installers: only this build's are kept.
      - name: Clear earlier installers
        run: find target/desktop -type d -path '*/release/bundle' -prune -exec rm -rf {} + 2>/dev/null || true
      - name: Build
        working-directory: desktop
        run: npx tauri build --ci --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            target/desktop
          key: desktop-${{ matrix.os }}-${{ hashFiles('desktop/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Collect the installers
        run: |
          mkdir -p dist
          version=$(node -p "require('./web/package.json').version")
          find target/desktop -path '*/release/bundle/*' -type f -name "RR73_${version}_*" \( -name '*.deb' -o -name '*.AppImage' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' \) -exec cp {} dist/ \;
          ls -l dist
          test -n "$(ls dist)"
      - uses: actions/upload-artifact@v4
        with: { name: 'installers-${{ matrix.os }}', path: dist/*, if-no-files-found: error }

  desktop-publish:
    name: Publish the desktop app
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && !failure()
    needs: [copy, rust, bench, web, e2e, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: 'installers-*', path: dist, merge-multiple: true }
      - name: Attach the installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          # tools/release/release.sh publish creates the release just after it pushes the tag.
          for _ in $(seq 1 30); do gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && break; sleep 10; done
          gh release upload "$GITHUB_REF_NAME" dist/*.deb dist/*.AppImage dist/*.msi dist/*.exe dist/*.dmg --repo "$GITHUB_REPOSITORY" --clobber

  deploy:
    name: Deploy to GitHub Pages
    # Rust, the decoder gate and the end-to-end tests are skipped on a tag whose commit passed.
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && !failure()
    needs: [copy, rust, bench, web, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
