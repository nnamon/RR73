# RR73's desktop app: the web app in a Tauri 2 window, with native serial ports and an SNTP
# clock (docs/design/desktop.md). Its own workspace: Tauri needs the system's WebView libraries,
# which the main workspace's builds and CI do not carry.
[package]
name = "rr73-desktop-app"
description = "RR73 desktop app: the web app in a Tauri window with native serial ports and an SNTP clock"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nnamon/RR73"
publish = false

[workspace]

[lib]
name = "rr73_desktop_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
rr73-desktop = { path = "../crates/rr73-desktop" }
serde = { version = "1", features = ["derive"] }
serialport = "4.10"
tauri = { version = "2.12", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
