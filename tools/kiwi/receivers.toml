# KiwiSDR receivers for rr73-kiwi. tools/kiwi/README.md lists the fields and the politeness
# rules, which apply to every receiver and cannot be relaxed here.
#
# access: "club" for receivers of a club the RR73 owner (9V1NE) belongs to, "public" for any
# other receiver. Public receivers get longer breaks (at least 30 minutes) and waits.
# plan: bands by UTC time; sessions rotate through the bands of the current window. The
# windows must cover all 24 hours.

[[receiver]]
id = "sarts-web888"
name = "SARTS Web-888, Singapore"
host = "167.172.88.10"
port = 80                      # behind nginx
operator = "9V1YC for SARTS"
access = "club"                # 9V1NE is a SARTS member; other members still need free channels
software = "KiwiSDR v2026.205 (Web888_v2026.205)"
channels = 13
antenna = "Wellbrook loop"
grid = "OJ11"
session_minutes = 12
break_minutes = 5
latency_s = 0.0                # NTP timing correction; the IQ stream carries no usable GPS time

# Singapore is UTC+8. Daytime there (23:00 to 11:00 UTC): the high bands.
[[receiver.plan]]
from = "23:00"
to = "11:00"
bands = ["20m", "17m", "15m", "10m"]

# Evening and night there (11:00 to 23:00 UTC): the low bands and 20m.
[[receiver.plan]]
from = "11:00"
to = "23:00"
bands = ["40m", "30m", "20m"]

# Public receivers, one per region, for paths and noise the Singapore receiver does not hear.
# Chosen on 22 October 2026 from the public list (rx.linkfanel.net, generated from
# kiwisdr.com/public): GPS timing, 8 channels with at least 5 free, signal-to-noise among the best
# in the region. Plans are local day (high bands) and night (low bands and 20m), in UTC without
# daylight saving. HJ6UMR in Colombia, chosen first, was dropped the same day: its proxy addresses
# redirect to each other. G3SDH, VE7AV and VK5ARG's first receiver were dropped too: they close a
# program's stream after about 11 s (their ext_api setting), so only receivers that took a 30 s
# test stream stay.

