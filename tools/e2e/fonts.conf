<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- The app's font names (web/src/styles/tokens.css) mapped to open stand-ins for the iPhone's fonts. -->
<fontconfig>
  <alias binding="strong"><family>-apple-system</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>blinkmacsystemfont</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>SF Pro Text</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>SF Pro Display</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>Helvetica Neue</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>arial</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>SF Mono</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <alias binding="strong"><family>ui-monospace</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <alias binding="strong"><family>menlo</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <alias binding="strong"><family>Roboto Mono</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>JetBrains Mono</family></prefer></alias>
</fontconfig>
