[package]
name = "rr73-wasm"
description = "WebAssembly bindings for the RR73 app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rr73-ft8.workspace = true
rr73-wspr.workspace = true
rr73-decode.workspace = true
rr73-rtty.workspace = true
rr73-cat.workspace = true
# rustfft's WebAssembly SIMD kernels; .cargo/config.toml enables simd128 for wasm32.
rr73-dsp = { workspace = true, features = ["wasm-simd"] }
wasm-bindgen.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
rr73-chansim.workspace = true

[lints]
workspace = true
